# Packages build/app (assembled by scripts/pack.ts) into a per-user Windows installer (or the portable zip), a
# macOS disk image and zip for the architecture of the Mac it is built on, or a Linux AppImage and deb.
# pack.ts runs electron-builder with --projectDir build/app (scripts/pack-builder.ts), so the app directory is the
# project directory and every relative path here is relative to build/app, not to the repository.
appId: ai.pal.coopanion
productName: Coopanion
copyright: Copyright © 2026 Pal-AI-Lab, yxengram
electronVersion: 44.4.4
directories:
  # no app: the app is build/app itself (electron-builder would take app/ instead if app/package.json existed)
  # the repository's dist/ (the release workflow uploads from there)
  output: ../../dist
  # not the default build/: inside build/app that is the staged Cortico, which electron-builder would leave out of the app
  buildResources: ../../installer
# the Core child runs TypeScript sources through tsx and spawns esbuild, koffi, sherpa-onnx and pnpm: keep files unpacked
asar: false
npmRebuild: false
nodeGypRebuild: false
files:
  - "**/*"
# where app/updater.cjs looks for releases; with --publish never this only writes latest.yml and
# latest-linux.yml next to the installers (and app-update.yml into the app), which the release workflow uploads
publish:
  provider: github
  owner: yxengram
  repo: Coopanion
win:
  target:
    - target: nsis
      arch: [x64]
  icon: app/icons/icon.ico
  # the portable zip (COOPANION_CHANNEL=portable: scripts/pack.ts asks for the zip target only); the installer is named
  # under nsis. A zip target writes no latest.yml, so the portable build stays out of the automatic updates.
  artifactName: Coopanion-${version}-win-${arch}-portable.${ext}
# Asks where to install. Every file the app writes stays under that directory (data in data\),
# so the start-menu entry, which Windows keeps under AppData, is not created.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # looked up in buildResources (installer/)
  include: nsis.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: false
  shortcutName: Coopanion
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Coopanion-Setup-${version}.exe
# No Developer ID: the app is signed ad hoc ("-"), which Apple silicon needs to launch it at all;
# the first open goes through Privacy & Security → Open Anyway (see the README). It lives in the
# menu bar (LSUIElement), not the Dock; its data is in ~/Library/Application Support/Coopanion.
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.lifestyle
  icon: app/icons/icon.png
  identity: "-"
  artifactName: Coopanion-${version}-mac-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  # the permission texts macOS shows: English here, Chinese from InfoPlist.strings in the Chinese localizations
  # (the folder names Electron's own bundle uses)
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Coo uses the microphone to hear you. Speech is recognized on this Mac, and recordings are never uploaded.
    NSAppleEventsUsageDescription: When operating the computer, Coo uses this to bring the app you named to the front.
  extraResources:
    - from: ../../installer/mac/InfoPlist.strings
      to: zh_CN.lproj/InfoPlist.strings
    - from: ../../installer/mac/InfoPlist.strings
      to: zh_TW.lproj/InfoPlist.strings
dmg:
  writeUpdateInfo: false
# x64 only. Data goes to ~/.config/Coopanion. The app runs on X11 (XWayland under Wayland, see app/main.cjs);
# the tray needs a StatusNotifier host (most desktops have one; without it settings open from the pet's menu).
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: app/icons/icon.png
  category: Utility
  executableName: coopanion
  synopsis: An AI companion pet for your desktop
  maintainer: yxengram <21293076+yxengram@users.noreply.github.com>
  # ${arch} would read x86_64 for the AppImage and amd64 for the deb
  artifactName: Coopanion-${version}-linux-x64.${ext}
  desktop:
    entry:
      StartupWMClass: Coopanion
deb:
  # libxtst6/libxss1: the computer-use World's input and idle time; xdotool types text; zenity asks before acting
  depends: [libgtk-3-0 | libgtk-3-0t64, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0 | libatspi2.0-0t64, libuuid1, libsecret-1-0, libasound2 | libasound2t64, xdotool, zenity]
