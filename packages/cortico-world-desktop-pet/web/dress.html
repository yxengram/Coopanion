<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="dress.title">桌宠装扮</title>
<link rel="stylesheet" href="/web/pet.css">
<link rel="stylesheet" href="/web/dress.css">
</head>
<body class="dress-page">
<main>
  <div class="preview" id="preview" aria-label="预览" data-i18n-label="dress.preview">
    <div class="figure-layer" id="figureLayer"></div>
    <button class="tool mode" id="mode" type="button"></button>
    <p class="saved" id="saved" aria-live="polite"></p>
  </div>
  <div class="dress" id="dress">
    <div class="row-label" id="lbFigure" data-i18n="dress.figure">形象</div><div class="slot" id="optFigure" role="group" aria-labelledby="lbFigure"></div>
    <div class="row-label coo-only" id="lbPalette" data-i18n="dress.palette">配色</div><div class="slot coo-only" id="optPalette" role="group" aria-labelledby="lbPalette"></div>
    <div class="row-label coo-only" id="lbHead" data-i18n="dress.head">头顶</div><div class="slot coo-only" id="optHead" role="group" aria-labelledby="lbHead"></div>
    <div class="row-label coo-only" id="lbSide" data-i18n="dress.side">配件</div><div class="slot coo-only" id="optSide" role="group" aria-labelledby="lbSide"></div>
    <div class="row-label coo-only" id="lbGlasses" data-i18n="dress.glasses">眼镜</div><div class="slot coo-only" id="optGlasses" role="group" aria-labelledby="lbGlasses"></div>
    <div class="row-label coo-only" id="lbNeck" data-i18n="dress.neck">颈饰</div><div class="slot coo-only" id="optNeck" role="group" aria-labelledby="lbNeck"></div>
  </div>
</main>
<script type="module" src="/web/dress.js"></script>
</body>
</html>
